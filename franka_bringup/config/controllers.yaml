# This is a namespace agnostic configuration file for the Franka FR3 robot.
# That is to say, it is not tied to any specific namespace and can be used in
# any namespace.


/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98

      cartesian_elbow_example_controller:
        type: franka_example_controllers/CartesianElbowExampleController

      cartesian_orientation_example_controller:
        type: franka_example_controllers/CartesianOrientationExampleController

      cartesian_pose_elbow_example_controller:
        type: franka_example_controllers/CartesianElbowExampleController

      cartesian_pose_example_controller:
        type: franka_example_controllers/CartesianPoseExampleController

      cartesian_velocity_example_controller:
        type: franka_example_controllers/CartesianVelocityExampleController

      elbow_example_controller:
        type: franka_example_controllers/ElbowExampleController

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
        state_interfaces:
          robot_state

      gravity_compensation_example_controller:
        type: franka_example_controllers/GravityCompensationExampleController

      gripper_example_controller:
        type: franka_example_controllers/GripperExampleController

      joint_impedance_example_controller:
        type: franka_example_controllers/JointImpedanceExampleController

      joint_impedance_with_ik_example_controller:
        type: franka_example_controllers/JointImpedanceWithIKExampleController

      cartesian_impedance_example_controller:
        type: franka_example_controllers/CartesianImpedanceExampleController

      joint_position_example_controller:
        type: franka_example_controllers/JointPositionExampleController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      joint_velocity_example_controller:
        type: franka_example_controllers/JointVelocityExampleController

      model_example_controller:
        type: franka_example_controllers/ModelExampleController

      move_to_start_example_controller:
        type: franka_example_controllers/MoveToStartExampleController
      
      swerve_drive_controller:
        type: franka_mobile/SwerveDriveController


/**:
  joint_impedance_example_controller:
    ros__parameters:  
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      # Publish rate in Hz for convenience topics (current_pose, joint_states, wrenches, etc.).
      # Full robot state always publishes at the controller update rate (1kHz).
      convenience_publish_rate: 1000

/**:
  joint_impedance_with_ik_example_controller:
    ros__parameters:
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 10.0
        - 10.0
        - 5.0

/**:
  cartesian_impedance_example_controller:
    ros__parameters:
      robot_type: fr3
      arm_prefix: ""
      # Stiffness of the Cartesian spring between the measured and the equilibrium pose.
      # Damping is derived from it as 2*sqrt(k), i.e. critically damped. Both can be changed
      # at runtime through the ~/set_cartesian_stiffness service.
      translational_stiffness: 150.0  # N/m
      rotational_stiffness: 10.0      # Nm/rad
      # Pulls the arm back towards the configuration it was activated in, inside the
      # nullspace of the Cartesian task. Live-tunable as a parameter.
      nullspace_stiffness: 20.0       # Nm/rad

/**:
  move_to_start_example_controller:
    ros__parameters:
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 10.0
        - 10.0
        - 5.0

/**:
  swerve_drive_controller:
    ros__parameters:
      wheel_1_link_name: argo_drive_front_link
      wheel_2_link_name: argo_drive_rear_link
      state_interface_prefix: tmrv0_2_
      tf_frame_id: base

      linear:
        x:
          has_velocity_limits    : true
          max_velocity           : 0.35   # m/s    translational limit = 2-norm of (vx,vy,vz) <= RCU 1.75 (shared budget); 0.35/axis conservative
          min_velocity           : -0.35  # m/s
          has_acceleration_limits: true
          max_acceleration       : 0.4    # m/s^2   translational accel = 2-norm <= RCU 2.0; 0.4 = 20%
          min_acceleration       : -0.4   # m/s^2
          has_jerk_limits        : false
          max_jerk               : 10.0  # m/s^3
          min_jerk               : -10.0  # m/s^3
        y:
          has_velocity_limits    : true
          max_velocity           : 0.35   # m/s    translational limit = 2-norm of (vx,vy,vz) <= RCU 1.75 (shared budget); 0.35/axis conservative
          min_velocity           : -0.35  # m/s
          has_acceleration_limits: true
          max_acceleration       : 0.4    # m/s^2   translational accel = 2-norm <= RCU 2.0; 0.4 = 20%
          min_acceleration       : -0.4   # m/s^2
          has_jerk_limits        : false
          max_jerk               : 10.0  # m/s^3
          min_jerk               : -10.0  # m/s^3
      angular:
        z:
          has_velocity_limits    : true
          max_velocity           : 0.5     # rad/s   rotational limit = 2-norm of (wx,wy,wz) <= RCU 0.525 (= |wz| here); 0.5 keeps a small margin
          min_velocity           : -0.5    # rad/s
          has_acceleration_limits: true
          max_acceleration       : 0.3    # rad/s^2 rotational accel = 2-norm <= RCU 0.6; 0.3 = 50% (0.45 trips reflex; 0.3 tested-safe)
          min_acceleration       : -0.3   # rad/s^2
          has_jerk_limits        : false
          max_jerk               : 10.0  # rad/s^3
          min_jerk               : -10.0  # rad/s^3
