# NVIDIA GPU override for hosts that have one. Layer it over the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# or put `COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml` in a local,
# untracked docker/.env so plain `docker compose` picks it up on this host.
#
# Needs the NVIDIA Container Toolkit on the host, which also writes the CDI
# spec this file asks for (`nvidia-ctk cdi list` shows nvidia.com/gpu=all). The
# image is built with the cu130 torch wheel, which wants a driver >= 580.
#
# The GPU image gets its own tag, so it sits beside the CPU one
# (docker-inspire_franka:latest) instead of replacing it: switching between
# them is an `up -d`, not a rebuild. Only the torch layer differs.
services:
  inspire_franka:
    image: docker-inspire_franka:gpu
    build:
      args:
        TORCH_INDEX: cu130
    # The GPU through CDI, not `gpus: all`. With `gpus: all` the toolkit's hook
    # grants the device nodes behind Docker's back, and with the systemd cgroup
    # driver (Ubuntu's default) the next `systemctl daemon-reload` - any package
    # install or snap refresh triggers one - drops the grant: the running
    # container's nvidia-smi then fails with "Failed to initialize NVML: Unknown
    # Error" and torch quietly falls back to the CPU. CDI devices are Docker's
    # own, so they survive the reload.
    devices:
      - nvidia.com/gpu=all
