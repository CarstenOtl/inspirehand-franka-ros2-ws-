# Physical distilled-policy profile. The validated trajectory-replay joint
# controller performs homing; the Cartesian controller then owns the same seven
# FR3 effort interfaces and accepts bounded live policy targets.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 97
      overruns:
        manage: false
        print_warnings: false
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
      trajectory_replay_controller:
        type: franka_trajectory_replay/TrajectoryReplayController
      cartesian_trajectory_replay_controller:
        type: franka_trajectory_replay/CartesianTrajectoryReplayController

  franka_robot_state_broadcaster:
    ros__parameters:
      convenience_publish_rate: 100

  # Same hardware-validated joint-impedance homing path as traj_replay.
  trajectory_replay_controller:
    ros__parameters:
      robot_type: fr3
      arm_prefix: ""
      command_interface: effort
      k_gains: [150.0, 150.0, 150.0, 150.0, 62.5, 37.5, 12.5]
      d_gains: [15.0, 15.0, 15.0, 15.0, 5.0, 5.0, 2.5]
      stiffness_scale: 1.0
      gain_ramp_duration: 1.0
      coriolis_compensation: false
      pause_ramp_duration: 0.5
      torque_rate_limit: 0.0
      rate_limit: false
      set_collision_behavior: false
      goto_max_velocity: 0.5
      goto_max_acceleration: 1.0
      goto_min_duration: 5.0
      max_joint_step: 3.0
      max_trajectory_start_error: 0.001
      trajectory_velocity_scale: 1.0
      trajectory_acceleration_scale: 1.0
      abort_stop_duration: 0.5
      status_rate: 50.0

  cartesian_trajectory_replay_controller:
    ros__parameters:
      arm_id: fr3
      arm_prefix: ""
      base_frame: fr3_link0
      model_source: franka
      # Threading grasp centre, shared with replay.yaml and checked at startup.
      tool_offset_xyz: [-0.0874, -0.0327, 0.1453]
      tool_offset_rpy: [0.0, 0.0, 0.0]
      # Forge threading task-space gains. The setpoint is already clipped and
      # filtered by the checkpoint adapter, so do not add the example's 0.005
      # reference filter here.
      translational_stiffness: 565.0
      rotational_stiffness: 28.0
      nullspace_stiffness: 10.0
      stiffness_scale: 1.0
      target_filter: 1.0
      nullspace_target: trajectory
      coriolis_compensation: true
      torque_rate_limit: 1.0
      goto_max_velocity: 0.10
      goto_max_angular_velocity: 0.50
      goto_max_nullspace_velocity: 0.50
      goto_min_duration: 3.0
      max_goto_step_m: 0.30
      max_goto_step_rad: 1.0
      max_trajectory_start_error_m: 0.002
      max_trajectory_start_error_rad: 0.01
      goto_settle_tolerance_m: 0.0005
      goto_settle_tolerance_rad: 0.002
      goto_settle_timeout: 2.0
      workspace_min: [-0.855, -0.855, -0.36]
      workspace_max: [0.855, 0.855, 1.19]
      trajectory_velocity_scale: 1.0
      max_position_error: 0.08
      max_orientation_error: 0.35
      pause_ramp_duration: 0.5
      abort_stop_duration: 0.5
      # Native action clipping is component-wise at 20 mm / 0.097 rad, so the
      # corresponding 3-D norm bounds are sqrt(3) times those values. These
      # guards leave only numerical tolerance above that contract.
      max_policy_step_m: 0.036
      max_policy_step_rad: 0.18
      policy_command_timeout: 0.5
      # Keep Python policy subscribers out of the 1 kHz real-time stream. The
      # controller update and watchdog remain at controller_manager's 1 kHz.
      state_publish_rate: 50.0
      status_rate: 50.0
      set_collision_behavior: false
