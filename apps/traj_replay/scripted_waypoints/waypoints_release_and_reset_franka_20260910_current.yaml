release_start_pose: threading_release_start_pose_franka.yaml
state_machine: threading_release_and_reset
trajectory_space: robot_joint_position_pd
return_policy_initial_pose: threading_m24
settings:
  release_min_turn_deg: 55.0
  waypoint_duration_s: 0.7
  return_duration_s: 1.0
  position_tolerance_m: 0.005
  orientation_tolerance_deg: 5.0
  hand_tolerance_rad: 0.15
  waypoint_timeout_s: 16.0
recipe:
  source: four-waypoint joint-PD structure proven on origin/chi_testing TG2 and the
    September 5 FR3 recipe
  retargeting: four complete FR3 joint states solved offline against the current official-hand
    mount; TG2 horizontal distances and heights are projected monotonically along
    live grasp-center minus nut-center and TG2 relative orientations are composed
    onto the current release frame
  waypoint1: open thumb and index while holding the post-turn arm pose
  waypoint2: first outward TG2-distance exit joint pose
  waypoint3: second, farther outward TG2-distance exit/lift joint pose
  waypoint4: final far and high TG2-distance joint pose
  return: joint-PD interpolation from waypoint4 to the captured FR3 policy reset joint
    state
