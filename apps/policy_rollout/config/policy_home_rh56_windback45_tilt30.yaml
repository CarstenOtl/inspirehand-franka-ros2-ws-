description: >
  The reset of the RH56 students (task profile rh56_windback45_tilt30,
  exp_17): ForgeUltra 6c9b02a reset_poses/windback45_tilt30/reset_pose_m24.yaml,
  the M24 reset pose wound 45 deg about the bolt and tilted 30 deg wrist-up
  about the pinch axis, so link7 and the wrist clear the table. The hand values
  are RH56 leader angles (forge_osc.RH56_WINDBACK45_TILT30_PROFILE.entry_pinch,
  the reset pose's grasp: thumb rotation 1.185, thumb bend 0.0506, index
  0.2147); the rollout turns them into registers through the linkage map
  (rh56_hand.driver_radians_for_leaders). The support fingers are ignored
  there and tucked at register 100 (rh56_inactive_finger_register); the values
  below only keep the file's layout.
