schema_version: 1
name: fr3_dp3_policy_reset
description: >
  The distilled threading student's reset: FR3 M24 reset joints and the
  training grasp posture (forge_osc.THREADING_GRASP_POSTURE with the support
  fingers closed, utils/mujoco_student_rollout.RESET_HAND_POSTURE). The hand
  values are the policy's logical radians; the driver applies the thumb-yaw
  overlay to commands and the rollout inverts it on feedback.
  apps/traj_replay/demo_trajs/traj_2/homing.yaml has the same arm but a
  different hand (thumb yaw 1.086, thumb pitch 0.0002), which starts the policy
  about 0.1 rad away from its training reset.
units: radians

